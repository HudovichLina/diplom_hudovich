{% extends "base_generic.html" %}
    
{% block content %}
    <h1>Наша продукция</h1>
    <ul>
        {% for category in categories %}
            <li><a href="{% url 'product_list' category.slug %}">{{ category.name }}</a></li>
        {% endfor %}
    </ul>
    <h2>Общее количество реализуемых товаров: {{ total_products }}</h2>
{% endblock %}
